<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chemical property finder</title>
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="box">
        <h1>Chemical Property Finder</h1>
        <p>Enter a chemical name:</p>

        <input type="text" id="chemicalInput" placeholder="Type chemical name...">
        <button id="searchButton">Search</button>

        <div class="result" id="result">
            <p id="formula">Formula:</p>
            <p id="weight">Molecular Weight:</p>
        </div>
    </div>


</body>
</html>
